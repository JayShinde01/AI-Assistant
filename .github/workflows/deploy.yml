name: Deploy AI-Assistant to AWS ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO }}
      FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}

    steps:
    # ---------------------------
    # 1. Checkout code
    # ---------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------------------
    # 2. Configure AWS credentials
    # ---------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # ---------------------------
    # 3. Login to ECR (backend + frontend)
    # ---------------------------
    - name: Login to ECR (backend)
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ env.BACKEND_REPO }}

    - name: Login to ECR (frontend)
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ env.FRONTEND_REPO }}

    # ---------------------------
    # 4. Build & Push Backend Image
    # ---------------------------
    - name: Build backend image
      run: |
        IMAGE_TAG=${GITHUB_SHA}
        docker build -t backend:$IMAGE_TAG ./AI-Assistant-backend
        docker tag backend:$IMAGE_TAG $BACKEND_REPO:$IMAGE_TAG
        docker push $BACKEND_REPO:$IMAGE_TAG

        # Update ECS service with new image
        aws ecs update-service \
          --cluster vibrant-rabbit-py1eqp \
          --service ai-assistant-backend-task-service-owwbgu4b \
          --force-new-deployment \
          --image $BACKEND_REPO:$IMAGE_TAG

    # ---------------------------
    # 5. Build & Push Frontend Image
    # ---------------------------
    - name: Build frontend image
      run: |
        IMAGE_TAG=${GITHUB_SHA}
        docker build \
          --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
          --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
          --build-arg VITE_UPLOADS_BASE_URL=${{ secrets.VITE_UPLOADS_BASE_URL }} \
          -t frontend:$IMAGE_TAG ./AI-Assistant-frontend

        docker tag frontend:$IMAGE_TAG $FRONTEND_REPO:$IMAGE_TAG
        docker push $FRONTEND_REPO:$IMAGE_TAG

        # Update ECS service with new image
        aws ecs update-service \
          --cluster vibrant-rabbit-py1eqp \
          --service ai-assistant-frontend-task-service-63gyo9ee \
          --force-new-deployment \
          --image $FRONTEND_REPO:$IMAGE_TAG